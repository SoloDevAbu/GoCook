</div>
<!-- Input Area -->
<form action="#" class="w-full flex flex-col gap-lg" onsubmit="event.preventDefault(); alert('OTP Sent!');">
<div class="flex flex-col gap-base relative">
<label class="font-label-md text-label-md text-on-surface-variant sr-only" for="phone">Phone Number</label>
<div class="flex items-center bg-[#F1F3F5] rounded-lg border border-transparent focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<!-- Country Code Selector (Simplified) -->
<div class="flex items-center gap-xs px-sm py-sm border-r border-outline-variant/30 text-on-surface bg-transparent focus:outline-none cursor-pointer">
<span class="font-body-lg text-body-lg">IND</span>
<span class="font-body-lg text-body-lg">+91</span>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_drop_down</span>
</div>
<!-- Phone Number Input -->
<input class="flex-1 bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 px-sm py-sm w-full outline-none" id="phone" name="phone" placeholder="00000-00000" required="" type="tel">
</div>
</div>
